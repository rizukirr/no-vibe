name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Make hooks and tests executable
        run: chmod +x hooks/*.sh hooks/run-hook.cmd tests/*.sh

      - name: generated files are up to date
        run: npm run check

      - name: test_generate
        run: node tests/test_generate.mjs

      # Each test runs as its own step so a failure is attributed cleanly
      # in the GitHub Actions UI. continue-on-error is intentionally OFF
      # — first failure halts the job.

      - name: test_block_writes
        run: bash tests/test_block_writes.sh

      - name: test_block_bash_writes
        run: bash tests/test_block_bash_writes.sh

      - name: test_json
        run: bash tests/test_json.sh

      - name: test_status
        run: bash tests/test_status.sh

      - name: test_escape_hatch
        run: bash tests/test_escape_hatch.sh

      - name: test_contract_injection
        run: bash tests/test_contract_injection.sh

      - name: test_guard_parity
        run: node tests/test_guard_parity.mjs

      - name: test_manifests
        run: node tests/test_manifests.mjs
